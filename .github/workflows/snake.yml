# 잔디를 먹는 뱀 애니메이션을 매일 다시 그려 output 브랜치에 올린다
name: generate snake

on:
  schedule:
    - cron: "0 15 * * *"   # 매일 00:00 KST
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#3182f6&color_dots=#ebedf0,#c9ddff,#90bbff,#4f8ef7,#1b64da
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#1fc8ff&color_dots=#161b22,#0c2d5c,#13489a,#2f6fe0,#5aa9ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
